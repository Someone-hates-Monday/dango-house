<script>
const stage=document.querySelector('.stage'),cg=document.querySelector('.cg'),chip=document.querySelector('.memory-chip'),v=document.querySelector('video'),image=document.querySelector('.image');let ready=false,timer;const dismiss=()=>{cg.hidden=true;chip.hidden=false;v.pause();clearTimeout(timer)};const show=()=>{clearTimeout(timer);cg.hidden=false;chip.hidden=true;if(ready){v.currentTime=0;v.play().catch(()=>{});timer=setTimeout(dismiss,12000)}};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{stage.dataset.mode=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));show()});document.querySelectorAll('.tools button,#skip').forEach(b=>b.onclick=dismiss);document.querySelector('.replay').onclick=show;chip.onclick=show;document.onkeydown=e=>{if(e.key==='Escape')dismiss()};v.ontimeupdate=()=>document.querySelector('.progress').style.width=(v.duration?v.currentTime/v.duration*100:0)+'%';v.onended=()=>{clearTimeout(timer);document.getElementById('media-status').textContent='这一刻，留在小屋里';timer=setTimeout(dismiss,4500)};document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause()});v.onerror=()=>{image.dataset.ready='false';document.getElementById('media-status').textContent='视频加载失败 · 显示静帧';};async function check(){try{const r=await fetch('/test-results/cg-lab/rin-xia-v1/raw.mp4',{method:'HEAD'});if(r.ok){ready=true;v.src=r.url;image.dataset.ready=true;document.getElementById('media-status').textContent='Wan 14B 本地试片 · 未正式采用';show();return}}catch{}setTimeout(check,5000)}check();
